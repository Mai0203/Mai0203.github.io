<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="{{ .Description | default site.Params.description }}" />
    <meta name="author" content="{{ site.Params.author }}" />
    <meta name="theme-color" content="#fbf8f1" />
    <title>{{ if .IsHome }}{{ site.Title }} · 个人随笔{{ else }}{{ .Title }} · {{ site.Title }}{{ end }}</title>
    <link rel="canonical" href="{{ .Permalink }}" />
    <link rel="icon" href="{{ `favicon.svg` | relURL }}" type="image/svg+xml" />
    {{ with .OutputFormats.Get "RSS" }}<link rel="alternate" type="application/rss+xml" title="{{ site.Title }}" href="{{ .RelPermalink }}" />{{ end }}
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600&family=Noto+Serif+SC:wght@600;700&display=swap" rel="stylesheet" />
    <script>
      try {
        const savedTheme = localStorage.getItem("theme");
        const dark = savedTheme === "dark" || (!savedTheme && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
      } catch (_) {}
    </script>
    <link rel="stylesheet" href="{{ `css/style.css` | relURL }}" />
  </head>
  <body>
    {{ partial "essentials/header.html" . }}
    <main>{{ block "main" . }}{{ end }}</main>
    {{ partial "essentials/footer.html" . }}
    <script src="{{ `js/main.js` | relURL }}"></script>
  </body>
</html>
